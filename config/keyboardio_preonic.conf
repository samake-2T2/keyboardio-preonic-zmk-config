# Keyboardio Preonic 사용자 설정

# 키보드 이름 설정
CONFIG_ZMK_KEYBOARD_NAME="Preonic"

# 블루투스 무선 출력 최적화 (+8dBm 최대 출력으로 연결 안정성 확보)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 블루투스 페어링 프로필 수 (0~3번 슬롯, 총 4대 기기)
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4

# 키 입력 디바운스 최적화 (1ms 즉시 반응, 5ms 릴리즈로 키씹힘 및 중복 방지)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# [Butterfly Status Indicator] 나비 날개 1:1 블루투스 상태 표시기
CONFIG_KEYBOARDIO_BUTTERFLY_STATUS=y
CONFIG_BUTTERFLY_BRIGHTNESS=120
CONFIG_BUTTERFLY_DIM_BRIGHTNESS=20
CONFIG_BUTTERFLY_TIMEOUT_MS=5000
CONFIG_BUTTERFLY_BLINK_MS=400
CONFIG_BUTTERFLY_BOOT_ANIM_MS=1600

# 하드웨어 외부 전원 제어: P1.05 나비 LED 전원 공급 활성화
CONFIG_ZMK_EXT_POWER=y

# 일반 Underglow 비활성화 (나비 전용 상태 표시기 충돌 방지)
CONFIG_ZMK_RGB_UNDERGLOW=n

# 절전 (15분 후 완전 딥슬립 진입)
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 배터리 잔량 보고 및 마우스 키
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_POINTING=y

# NKRO (무한 동시 입력) 활성화
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ZMK Studio 활성화 (실시간 키맵 수정)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Rotary Encoder (EC11) 전역 스레드 트리거
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# [Piezo Sound System] 피에조 부저 사운드 (슈퍼마리오 부팅음 & 오디오 클릭키)
CONFIG_KEYBOARDIO_PREONIC_SOUND=y
CONFIG_PREONIC_SOUND_CLICKY_DEFAULT=y
CONFIG_PREONIC_SOUND_COIN_BOOT=y

